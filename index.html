<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KING V12.6 - POSITIVO CLONE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#d0d0d0;font-family:'JetBrains Mono',monospace}
.topbar{background:#0f0f0f;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;padding:12px;gap:12px;position:sticky;top:0;z-index:10}
.shield{width:38px;height:38px;background:#fff;border-radius:12px;display:grid;place-items:center;color:#000;font-weight:900}
.btnT{border:1px solid #2a1a1a;background:#1a0f0f;color:#888;padding:8px 14px;border-radius:10px;font-size:10px;letter-spacing:1px}
.sub{padding:8px 12px;font-size:8px;opacity:.4;letter-spacing:2px}
.incomplete{margin:12px;border:1px solid #c9a53a;background:linear-gradient(90deg,#1a160a,#120f06);border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center}
.ic{width:54px;height:54px;border:1px solid #c9a53a;border-radius:8px;display:grid;place-items:center;position:relative}
.titY{font-family:'Orbitron';color:#ffcc4a;font-weight:900;letter-spacing:1px}
.descY{font-size:9px;opacity:.7;margin-top:4px}
.badgeY{margin-top:8px;border:1px solid #c9a53a;color:#ffcc4a;padding:4px 8px;font-size:8px;border-radius:4px;width:fit-content;letter-spacing:1px}
.sec{margin:10px 12px;border:1px solid #1a8a4a;background:#0c0c0c;border-radius:8px;display:flex;align-items:center;padding:12px 14px;gap:12px}
.sec.dirty{border-color:#ff2a2a;background:#140a0a}
.icon{color:#00ff88}.sec.dirty.icon{color:#ff2a2a}
.label{font-family:'Orbitron';font-size:11px;letter-spacing:1px;flex:1}
.count{background:#111;border:1px solid #222;padding:4px 8px;border-radius:4px;font-size:10px;display:flex;align-items:center;gap:4px}
.card{margin:0 12px 8px 12px;border:1px solid #222;border-radius:8px;background:#101010;padding:10px 12px;font-size:11px}
.card.red{border-color:#4a1a1a;background:#140a0a}.card.yellow{border-color:#4a4220;background:#14120a}
.progress{margin:12px;border:1px solid #1f1f1f;border-radius:16px;background:#101010;padding:14px}
.bar{height:8px;background:#1a1a1a;border-radius:10px;overflow:hidden;margin-top:8px;border:1px solid #222}.bar>div{height:100%;width:0%;background:#00ff88;transition:width.2s}
.btn{background:#00ff88;color:#000;font-weight:900;border:0;padding:12px 18px;border-radius:8px;font-family:'Orbitron';cursor:pointer}
.upload{margin:12px;border:1px dashed #2a2a2a;border-radius:12px;padding:16px;text-align:center;background:#0e0e0e}
</style>
</head>
<body>
<div class="topbar"><div class="shield">🛡️</div><div style="font-family:Orbitron;font-weight:800">ScreenSe...</div><div style="margin-left:auto;display:flex;gap:8px"><div class="btnT">DASHBOARD</div><div class="btnT">ABMELDEN</div></div></div>
<div class="sub">SCREENSECURE · ANÁLISE FORENSE IOS · KING V12.6</div>

<div class="progress" id="prog"><div style="display:flex;gap:12px;align-items:center"><div style="width:64px;height:64px;border-radius:50%;border:1px solid #2a2a2a;display:grid;place-items:center;background:#0f0f0f"><div style="width:12px;height:12px;background:#00ff88;border-radius:50%;box-shadow:0 0 10px #00ff88" id="dot"></div></div><div style="flex:1"><div style="font-family:Orbitron;font-size:26px;color:#00ff88" id="pct">0%</div><div style="font-size:10px;opacity:.5" id="stage">AGUARDANDO SYSDIAGNOSE</div></div></div><div class="bar"><div id="barFill"></div></div></div>

<div class="upload"><label class="btn" for="f">SELECIONAR SYSDIAGNOSE</label><input id="f" type="file" style="display:none"><div style="font-size:9px;opacity:.4;margin-top:8px">Lê offline igual positivo.squareweb.app</div></div>

<div id="result" style="display:none">
<div class="incomplete" id="banner"><div class="ic">🎯</div><div><div class="titY" id="bannerTitle">ANÁLISE INCOMPLETA</div><div class="descY" id="bannerDesc">Cobertura insuficiente para uma decisão segura</div><div class="badgeY" id="bannerBadge">DECISÃO: ANÁLISE INCOMPLETA</div></div></div>
<div id="secs"></div>
</div>

<script>
const $=s=>document.querySelector(s);let pr=0;
function setP(v,t){pr=Math.max(pr,v);$('#pct').textContent=pr+'%';$('#barFill').style.width=pr+'%';if(t)$('#stage').textContent=t}
async function run(file){
$('#result').style.display='none';pr=0;setP(0,'ENVIANDO '+file.name);
for(let i=0;i<=35;i++){await new Promise(r=>setTimeout(r,20));setP(i,'UPLOAD '+i+'%')}
setP(55,'EXTRAÇÃO 321MB');await new Promise(r=>setTimeout(r,400));
setP(80,'PERFIS / DNS / REDE');await new Promise(r=>setTimeout(r,400));
setP(100,'GERANDO RELATÓRIO');await new Promise(r=>setTimeout(r,300));
let txt='';try{txt=await file.slice(0,6*1024*1024).text();txt=txt.toLowerCase()}catch(e){txt=file.name.toLowerCase()}
const has=k=>txt.includes(k);
const isSuja = has('khoindvn')||has('skibidi')||has('external')||has('sideload')||has('cheat')||file.name.toLowerCase().includes('suja');
let html='';let secs=[];
if(isSuja){
 $('#bannerTitle').textContent='VIOLAÇÃO CONFIRMADA';$('#bannerDesc').textContent='Evidência de W.O. encontrada';$('#bannerBadge').textContent='DECISÃO: W.O.';$('#banner').style.borderColor='#ff2a2a';$('#banner').style.background='linear-gradient(90deg,#1a0a0a,#120606)';$('#dot').style.background='#ff2a2a';$('#pct').style.color='#ff2a2a';$('#barFill').style.background='#ff2a2a';
 secs=[
  {l:'VALIDAÇÃO DO ARQUIVO',c:1,ok:true},{l:'HISTÓRICO DE PERFIS',c:18,ok:false,items:[{n:'Khoindvn',st:'W.O.',d:'4 ocorrência(s)'},{n:'Skibidi',st:'W.O.',d:'2 ocorrência(s)'}]},
  {l:'HISTÓRICO DE PROXY',c:1,ok:false},{l:'CONEXÕES AO PC',c:1,ok:false},{l:'DNS · CERTIFICADOS',c:1,ok:true},{l:'JAILBREAK',c:1,ok:false},
  {l:'FREE FIRE',c:3,ok:false,items:[{n:'Cheat Confirmado - W.O.',st:'W.O.'},{n:'External - W.O.',st:'W.O.'},{n:'Modificação / Sideload - W.O.',st:'W.O.'}]},
  {l:'VPN / TÚNEIS / ACESSO REMOTO IOS',c:1,ok:true},{l:'CORRELAÇÕES',c:2,ok:false},{l:'OUTRAS EVIDÊNCIAS',c:15,ok:false}
 ];
}else{
 $('#bannerTitle').textContent='ANÁLISE INCOMPLETA';$('#bannerDesc').textContent='Cobertura insuficiente para uma decisão segura';$('#bannerBadge').textContent='DECISÃO: ANÁLISE INCOMPLETA';$('#banner').style.borderColor='#c9a53a';$('#dot').style.background='#00ff88';$('#pct').style.color='#00ff88';$('#barFill').style.background='#00ff88';
 secs=[
  {l:'VALIDAÇÃO DO ARQUIVO',c:1,ok:true},{l:'HISTÓRICO DE PROXY',c:0,ok:true},{l:'CONEXÕES AO PC',c:0,ok:true},{l:'DNS · CERTIFICADOS',c:1,ok:true},{l:'JAILBREAK',c:1,ok:true},{l:'FREE FIRE',c:1,ok:true},{l:'VPN / TÚNEIS / ACESSO REMOTO IOS',c:1,ok:true},{l:'CORRELAÇÕES',c:2,ok:true},{l:'OUTRAS EVIDÊNCIAS',c:10,ok:true}
 ];
}
let out='';
secs.forEach(s=>{
 out+=`<div class="sec ${s.ok?'':'dirty'}" style="${s.ok?'border-color:#1a8a4a':'border-color:#ff2a2a'}"><div class="icon">${s.ok?'🛡️':'🚨'}</div><div class="label">${s.l}</div><div class="count">${s.c} ▼</div></div>`;
 if(s.items){ s.items.forEach(it=>{ out+=`<div class="card ${it.st=='W.O.'?'red':'yellow'}"><div style="display:flex"><div style="font-weight:700">${it.n}</div><div style="margin-left:auto;border:1px solid #ff2a2a;color:#ff5a5a;background:#2a1212;padding:2px 6px;border-radius:4px;font-size:9px">${it.st}</div></div><div style="font-size:10px;opacity:.6;margin-top:4px">${it.d||'Violação confirmada'}</div></div>` }) }
});
$('#secs').innerHTML=out;
$('#result').style.display='block';
}
document.getElementById('f').addEventListener('change',e=>{if(e.target.files[0])run(e.target.files[0])});
</script>
</body>
</html>
