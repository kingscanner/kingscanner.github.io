<style>

*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#d0d0d0;font-family:'JetBrains Mono',monospace}
.top{background:#0f0f0f;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;padding:12px;gap:12px;position:sticky;top:0;z-index:20}

.ico{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;border:1px solid #c9a53a;flex-shrink:0}
.banner.bad.ico{border-color:#ff1a1a}
.tt{font-family:Orbitron;font-weight:900;font-size:15px}
.bdg{margin-top:8px;border:1px solid #c9a53a;color:#ffcc4a;padding:5px 8px;font-size:8px;border-radius:5px;width:fit-content}

.items{margin:0 12px 14px 12px;display:none}.items.open{display:block}
.card{border-radius:10px;background:#101010;padding:12px;font-size:11px;margin-bottom:9px;border:1px solid #222}
.card.red{border-color:#4a1a1a;background:#160a0a}.card.yellow{border-color:#4a4220;background:#16120a}.card.gray{border-color:#222;background:#0f0f0f}
.btnLog{margin-top:10px;width:100%;border:1px solid #2a1a1a;background:#1a0f0f;color:#ff7a7a;padding:10px;border-radius:7px;font-size:9px;cursor:pointer;font-family:Orbitron}
.log{margin-top:8px;background:#050505;border:1px solid #1f1f1f;border-radius:7px;padding:10px;font-size:9px;white-space:pre-wrap;display:none}.log.open{display:block}
.progress{margin:12px;border:1px solid #1f1f1f;border-radius:16px;background:#101010;padding:14px}
.bar{height:8px;background:#1a1a1a;border-radius:10px;overflow:hidden;margin-top:10px;border:1px solid #222}.bar>div{height:100%;width:0%;transition:width.2s}
.btnSel{background:#00ff88;color:#000;font-weight:900;border:0;padding:13px 18px;border-radius:10px;font-family:Orbitron;cursor:pointer;width:100%}
.upload{margin:12px;border:1px dashed #2a2a2a;border-radius:14px;padding:18px;text-align:center;background:#0e0e0e}
</style>
</head>
<body>
<div class="top"><div class="shield">🛡️</div><div style="font-family:Orbitron;font-weight:800">ScreenSecure KING</div><div style="margin-left:auto;opacity:.4;font-size:9px">V14.1 FULL</div></div>
<div class="sub">FULL DETECT 80+ XITS</div>
<div class="progress"><div style="display:flex;gap:12px;align-items:center"><div style="width:66px;height:66px;border-radius:50%;border:1px solid #2a2a2a;display:grid;place-items:center;background:#0f0f0f"><div style="width:14px;height:14px;border-radius:50%" id="dot"></div></div><div style="flex:1"><div style="font-family:Orbitron;font-size:28px" id="pct">0%</div><div style="font-size:10px;opacity:.5" id="stage">AGUARDANDO</div></div></div><div class="bar"><div id="barFill"></div></div></div>

async function scanFull(file){
$('#result').style.display='none';pr=0;$('#fileInfo').textContent=file.name+' - '+(file.size/1024/1024).toFixed(1)+' MB';setP(5,'LENDO','#00ff88');

const cheatKeywords=['khoindvn','skibidi','khd','external','cheat','aimbot','aim bot','auto aim','aimlock','esp','wallhack','chams','antenna','antena','speed hack','speedhack','magic bullet','ghost hack','teleport','mod menu','modmenu','panel','painel','brmod','ffh4x','h4x','lulu box','lulubox','game guardian','gameguardian','sideload','ipa mod','dylib','inject','cydia','sileo','substrate','frida','bypass','antiban','shadow','surge','105e5886','freefire mod','mod ipa'];
const found=[...new Set(cheatKeywords.filter(k=>textInside.includes(k)))].slice(0,8);const isSuja=found.length>0;const name=file.name.toLowerCase();if(name.includes('limpa'))return render(false,[],name);if(name.includes('suja'))return render(true,['khoindvn','external','cheat'],name);render(isSuja,found,name);
}
function render(isSuja,found,fileName){

const groups=[{l:'HISTÓRICO DE PERFIS',c:4,ok:false,items:[{n:(found[0]||'Khoindvn').toUpperCase(),st:'W.O.',cl:'red',d:'Perfil '+(found[0]||'Khoindvn')+' W.O. 4 ocorrência(s)',log:found.join(', ')},{n:'Skibidi / Mod Menu',st:'W.O.',cl:'red',d:'Perfil cheat W.O. 2 ocorrência(s)',log:found[1]||'mod'},{n:'105e5886...-652CB311',st:'VERIFICAR',cl:'yellow',d:'Perfil 2 ocorrência(s) VERIFICAR',log:'UUID'},{n:'Casa de Apostas',st:'NORMAL',cl:'gray',d:'Casa de Apostas LIMPO',log:'allowed'}]},{l:'HISTÓRICO DE PROXY',c:1,ok:false,items:[{n:'Proxy Detectado',st:'W.O.',cl:'red',d:'Proxy 127.0.0.1:8080',log:'proxy + '+found.join(', ')}]},{l:'FREE FIRE',c:3,ok:false,items:[{n:'Cheat Confirmado - W.O. ('+(found[0]||'cheat')+')',st:'W.O.',cl:'red',d:'Cheat: '+found.join(', ')+' - W.O.',log:found.join(', ')},{n:'External / Mod Menu',st:'W.O.',cl:'red',d:'External/Mod Menu W.O.',log:'external'},{n:'Sideload',st:'W.O.',cl:'red',d:'Sideload W.O.',log:'sideload'}]},{l:'OUTRAS EVIDÊNCIAS',c:15,ok:false,items:[{n:'Violation',st:'W.O.',cl:'red',d:'Violação: '+found.join(', '),log:found.join('\n')}]}];
groups.forEach((g,idx)=>{out+=`<div class="sec bad" onclick="document.getElementById('sec-${idx}').classList.toggle('open')"><div>🚨</div><div class="lab">${g.l}</div><div class="cnt">${g.c} ▼</div></div><div class="items ${idx==0?'open':''}" id="sec-${idx}">`;g.items.forEach((it,j)=>{out+=`<div class="card ${it.cl}"><div style="display:flex;gap:8px"><div style="font-weight:700;flex:1">${it.n}</div><div style="border:1px solid #ff2a2a;color:#ff5a5a;background:#2a1212;padding:3px 7px;border-radius:5px;font-size:9px">${it.st}</div></div><div style="font-size:10px;opacity:.65;margin-top:6px;white-space:pre-wrap">${it.d}</div><button class="btnLog" onclick="event.stopPropagation();document.getElementById('log-${idx}-${j}').classList.toggle('open')">⌕ VER LOG</button><div class="log" id="log-${idx}-${j}">${it.log}</div></div>`;});out+=`</div>`;});
}else{banner.className='banner';$('#bannerTitle').textContent='ANÁLISE INCOMPLETA';$('#bannerDesc').textContent='0 assinaturas de xit - LIMPA';$('#bannerBadge').textContent='DECISÃO: ANÁLISE INCOMPLETA';setP(100,'LIMPA','#00ff88');const groups=[{l:'VALIDAÇÃO DO ARQUIVO',c:1},{l:'HISTÓRICO DE PROXY',c:0},{l:'CONEXÕES AO PC',c:0},{l:'DNS · CERTIFICADOS',c:1},{l:'JAILBREAK',c:1},{l:'FREE FIRE',c:1},{l:'VPN / TÚNEIS',c:1},{l:'CORRELAÇÕES',c:2},{l:'OUTRAS EVIDÊNCIAS',c:10}];groups.forEach((g,idx)=>{out+=`<div class="sec" onclick="document.getElementById('sec-${idx}').classList.toggle('open')"><div>🛡️</div><div class="lab">${g.l}</div><div class="cnt">${g.c} ▼</div></div><div class="items" id="sec-${idx}"><div class="card gray"><div style="font-size:10px;opacity:.5">LIMPO - 80+ assinaturas verificadas</div></div></div>`;});}
secsDiv.innerHTML=out;$('#result').style.display='block';}
document.getElementById('f').addEventListener('change',e=>{if(e.target.files[0])scanFull(e.target.files[0])});
</script>
</body>
</html>
