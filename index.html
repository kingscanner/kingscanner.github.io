<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>KING V13 - FIX FINAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#d0d0d0;font-family:'JetBrains Mono',monospace;-webkit-tap-highlight-color:transparent}
.top{background:#0f0f0f;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;padding:12px;gap:12px;position:sticky;top:0;z-index:20}
.shield{width:40px;height:40px;background:#fff;border-radius:12px;display:grid;place-items:center;font-size:20px}
.sub{padding:8px 12px;font-size:8px;opacity:.35;letter-spacing:2px}
.banner{margin:12px;border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center;border:1px solid #c9a53a;background:linear-gradient(90deg,#1a160a,#120f06)}
.banner.bad{border-color:#ff1a1a;background:linear-gradient(90deg,#1a0a0a,#150606);box-shadow:0 0 20px rgba(255,0,0,.15)}
.ico{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;border:1px solid #c9a53a;flex-shrink:0}
.banner.bad.ico{border-color:#ff1a1a}
.tt{font-family:Orbitron;font-weight:900;font-size:15px;letter-spacing:.5px}
.banner.tt{color:#ffcc4a}.banner.bad.tt{color:#ff3b3b}
.dd{font-size:9px;opacity:.7;margin-top:4px;line-height:12px}
.bdg{margin-top:8px;border:1px solid #c9a53a;color:#ffcc4a;padding:5px 8px;font-size:8px;border-radius:5px;width:fit-content;letter-spacing:1px}
.banner.bad.bdg{border-color:#ff1a1a;color:#ff5a5a;background:rgba(255,0,0,.08)}
.sec{margin:10px 12px;border-radius:10px;display:flex;align-items:center;padding:13px 14px;gap:12px;cursor:pointer;user-select:none;border:1px solid #1a8a4a;background:#0c0c0c}
.sec.bad{border-color:#ff2a2a;background:#130a0a}
.lab{font-family:Orbitron;font-size:11px;flex:1;letter-spacing:.5px}
.cnt{background:#111;border:1px solid #222;padding:5px 9px;border-radius:6px;font-size:11px;display:flex;gap:4px;align-items:center}
.items{margin:0 12px 14px 12px;display:none}
.items.open{display:block}
.card{border-radius:10px;background:#101010;padding:12px;font-size:11px;margin-bottom:9px;border:1px solid #222}
.card.red{border-color:#4a1a1a;background:#160a0a}
.card.yellow{border-color:#4a4220;background:#16120a}
.card.gray{border-color:#222;background:#0f0f0f}
.btnLog{margin-top:10px;width:100%;border:1px solid #2a1a1a;background:#1a0f0f;color:#ff7a7a;padding:10px;border-radius:7px;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:Orbitron}
.log{margin-top:8px;background:#050505;border:1px solid #1f1f1f;border-radius:7px;padding:10px;font-size:9px;white-space:pre-wrap;word-break:break-all;display:none;line-height:13px}
.log.open{display:block}
.progress{margin:12px;border:1px solid #1f1f1f;border-radius:16px;background:#101010;padding:14px}
.bar{height:8px;background:#1a1a1a;border-radius:10px;overflow:hidden;margin-top:10px;border:1px solid #222}
.bar>div{height:100%;width:0%;transition:width.2s}
.btnSel{background:#00ff88;color:#000;font-weight:900;border:0;padding:13px 18px;border-radius:10px;font-family:Orbitron;cursor:pointer;width:100%;letter-spacing:1px;font-size:12px}
.upload{margin:12px;border:1px dashed #2a2a2a;border-radius:14px;padding:18px;text-align:center;background:#0e0e0e}
</style>
</head>
<body>
<div class="top"><div class="shield">🛡️</div><div style="font-family:Orbitron;font-weight:800;letter-spacing:1px">ScreenSecure KING</div><div style="margin-left:auto;opacity:.4;font-size:9px">V13 FINAL</div></div>
<div class="sub">SCREENSECURE · ANÁLISE FORENSE IOS · CLONE POSITIVO</div>
<div class="progress"><div style="display:flex;gap:12px;align-items:center"><div style="width:66px;height:66px;border-radius:50%;border:1px solid #2a2a2a;display:grid;place-items:center;background:#0f0f0f;flex-shrink:0"><div style="width:14px;height:14px;border-radius:50%;box-shadow:0 0 12px currentColor" id="dot"></div></div><div style="flex:1"><div style="font-family:Orbitron;font-size:28px" id="pct">0%</div><div style="font-size:10px;opacity:.5;letter-spacing:1px" id="stage">AGUARDANDO SYSDIAGNOSE</div></div></div><div class="bar"><div id="barFill"></div></div></div>
<div class="upload"><label class="btnSel" for="f">SELECIONAR SYSDIAGNOSE</label><input id="f" type="file" accept=".tar,.gz,.tar.gz"><div style="font-size:9px;opacity:.4;margin-top:10px" id="fileInfo">LIMPA = nome com "limpa" | SUJA = qualquer outro nome</div></div>
<div id="result" style="display:none">
<div class="banner" id="banner"><div class="ico" id="bannerIco">🎯</div><div style="flex:1"><div class="tt" id="bannerTitle">ANÁLISE INCOMPLETA</div><div class="dd" id="bannerDesc"></div><div class="bdg" id="bannerBadge"></div></div></div>
<div id="secs"></div>
</div>
<script>
const $=s=>document.querySelector(s);let pr=0;
function setP(v,t,c){pr=Math.max(pr,v);const pctEl=$('#pct');const barEl=$('#barFill');const dotEl=$('#dot');pctEl.textContent=pr+'%';barEl.style.width=pr+'%';if(c){pctEl.style.color=c;barEl.style.background=c;dotEl.style.background=c;dotEl.style.color=c}if(t)$('#stage').textContent=t;}
async function run(file){$('#result').style.display='none';pr=0;$('#fileInfo').textContent=file.name+' - '+(file.size/1024/1024).toFixed(1)+' MB';setP(0,'ENVIANDO '+file.name,'#00ff88');for(let i=0;i<=40;i++){await new Promise(r=>setTimeout(r,12));setP(i,'UPLOAD '+i+'%','#00ff88')}setP(60,'EXTRAÇÃO 321MB','#00ff88');await new Promise(r=>setTimeout(r,250));setP(85,'PERFIS / PROXY / DNS / FREE FIRE','#00ff88');await new Promise(r=>setTimeout(r,300));setP(100,'GERANDO RELATÓRIO','#00ff88');await new Promise(r=>setTimeout(r,200));const name=file.name.toLowerCase();const isLimpa=name.includes('limpa')&&!name.includes('suja');const isSuja=!isLimpa;const banner=$('#banner');let out='';const secsDiv=$('#secs');if(isSuja){banner.className='banner bad';$('#bannerTitle').textContent='VIOLAÇÃO CONFIRMADA';$('#bannerDesc').textContent='Evidência de W.O. encontrada - Khoindvn / Skibidi / External / Cheat';$('#bannerBadge').textContent='DECISÃO: W.O. CONFIRMADO';setP(100,'W.O. CONFIRMADO','#ff2a2a');const groups=[{l:'VALIDAÇÃO DO ARQUIVO',c:1,ok:true,items:[]},{l:'HISTÓRICO DE PERFIS',c:4,ok:false,items:[{n:'Khoindvn',st:'W.O.',cl:'red',d:'O perfil Khoindvn corresponde a uma regra oficial de W.O.\nForam preservadas 4 ocorrência(s) no histórico.',log:'[PROFILES] com.khoindvn.profile\nMatches: 4\nPath: /private/var/containers/Shared/SystemGroup/.../khoindvn\nSignature: 105e5886f1f52d411eab5700f12f4176fffa485'},{n:'Skibidi',st:'W.O.',cl:'red',d:'O perfil Skibidi corresponde a uma regra oficial de W.O.\nForam preservadas 2 ocorrência(s) no histórico.',log:'[PROFILES] com.skibidi.toilet.profile\nMatches: 2\nUUID: A1B2C3D4-E5F6-7890'},{n:'105e5886f1f52d411eab5700f12f4176fffa485...-652CB311',st:'VERIFICAR',cl:'yellow',d:'Perfil preservado no histórico. 2 ocorrência(s).\nSem assinatura oficial suficiente, permanece VERIFICAR.',log:'Profile UUID: 105e5886...\nOccurrences: 2\nNot in whitelist -> VERIFICAR'},{n:'Casa de Apostas',st:'NORMAL',cl:'gray',d:'Perfil Casa de Apostas reconhecido como Casa de Apostas. 1 ocorrência(s). LIMPO.',log:'Betting profile - allowed\n1 occurrence'}]},{l:'HISTÓRICO DE PROXY',c:1,ok:false,items:[{n:'Proxy Detectado - W.O.',st:'W.O.',cl:'red',d:'Histórico de proxy encontrado.\nHTTP Proxy: 127.0.0.1:8080\nInjeção detectada via NetworkExtension.',log:'HTTP Proxy: 127.0.0.1:8080\nFound in: com.apple.networkextension\nType: Manual Proxy'}]},{l:'CONEXÕES AO PC',c:1,ok:false,items:[{n:'Conexão Externa - W.O.',st:'W.O.',cl:'red',d:'Conexão suspeita ao PC detectada.\nDispositivo externo identificado.',log:'USB Log: External device connected\nVendor: Unknown'}]},{l:'DNS · CERTIFICADOS',c:1,ok:true,items:[]},{l:'JAILBREAK',c:1,ok:false,items:[{n:'Jailbreak Evidence - W.O.',st:'W.O.',cl:'red',d:'Evidência de jailbreak / modificação detectada.',log:'Found: Cydia / Sileo / checkra1n traces\nPath: /Applications/Cydia.app'}]},{l:'FREE FIRE',c:3,ok:false,items:[{n:'Cheat Confirmado - W.O.',st:'W.O.',cl:'red',d:'Foi confirmada a violação Cheat Confirmado.\nA identidade e o comportamento decisivo cumpriram a regra vencedora. A evidência confirmada aplica W.O.',log:'FREE FIRE: com.dts.freefireth\nPattern: external injection\nRule: CHEAT_CONFIRMADO => W.O.\nFile: ExternalCheat.dylib'},{n:'External - W.O.',st:'W.O.',cl:'red',d:'Foi confirmada a violação External.\nA identidade e o comportamento decisivo cumpriram a regra vencedora. A evidência confirmada aplica W.O.',log:'Found: /var/mobile/Containers/Data/.../ExternalCheat.dylib\nSize: 245KB'},{n:'Modificação / Sideload - W.O.',st:'W.O.',cl:'red',d:'Foi confirmada a violação Modificação / Sideload.\nA identidade e o comportamento decisivo cumpriram a regra vencedora. A evidência confirmada aplica W.O.',log:'Sideload detected\nSignature: non-AppStore\nIPA: com.dts.freefireth.mod'}]},{l:'VPN / TÚNEIS / ACESSO REMOTO IOS',c:1,ok:true,items:[]},{l:'CORRELAÇÕES',c:2,ok:false,items:[{n:'Correlação W.O.',st:'W.O.',cl:'red',d:'Cruzamento de evidências: Khoindvn + External + Proxy + Sideload = W.O. CONFIRMADO',log:'Correlation Engine:\nKhoindvn (4) + External (1) + Proxy (1) + Sideload (1) = W.O.\nConfidence: 98%'}]},{l:'OUTRAS EVIDÊNCIAS',c:15,ok:false,items:[{n:'Game Security Violation - W.O.',st:'W.O.',cl:'red',d:'Violação de segurança do jogo confirmada.',log:'Anti-cheat bypass detected\nPTrace: blocked'},{n:'Injeção Detectada',st:'W.O.',cl:'red',d:'Injeção em tempo de execução detectada.',log:'dylib injection found'}]}];groups.forEach((g,idx)=>{out+=`<div class="sec ${g.ok?'':'bad'}" onclick="document.getElementById('sec-${idx}').classList.toggle('open')"><div>${g.ok?'🛡️':'🚨'}</div><div class="lab">${g.l}</div><div class="cnt">${g.c} ▼</div></div><div class="items ${idx<=1?'open':''}" id="sec-${idx}">`;if(g.items&&g.items.length>0){g.items.forEach((it,j)=>{const stColor=it.st==='W.O.'?'#ff2a2a':it.st==='VERIFICAR'?'#b89a3a':'#2a8a4a';const stBg=it.st==='W.O.'?'#2a1212':it.st==='VERIFICAR'?'#2a2410':'#122a18';const stTxt=it.st==='W.O.'?'#ff5a5a':it.st==='VERIFICAR'?'#ffde7a':'#7dff9d';out+=`<div class="card ${it.cl}"><div style="display:flex;gap:8px"><div style="font-weight:700;flex:1;word-break:break-all;font-size:11px">${it.n}</div><div style="border:1px solid ${stColor};color:${stTxt};background:${stBg};padding:3px 7px;border-radius:5px;font-size:9px;height:fit-content;white-space:nowrap">${it.st}</div></div><div style="font-size:10px;opacity:.65;margin-top:6px;white-space:pre-wrap;line-height:13px">${it.d}</div><button class="btnLog" onclick="event.stopPropagation();document.getElementById('log-${idx}-${j}').classList.toggle('open')">⌕ VER LOG DO RESULTADO</button><div class="log" id="log-${idx}-${j}">${it.log}</div></div>`;});}else{out+=`<div class="card gray"><div style="font-size:10px;opacity:.5">Nenhuma evidência relevante - validado</div></div>`;}out+=`</div>`;});}else{banner.className='banner';$('#bannerTitle').textContent='ANÁLISE INCOMPLETA';$('#bannerDesc').textContent='Cobertura insuficiente para uma decisão segura - LIMPA';$('#bannerBadge').textContent='DECISÃO: ANÁLISE INCOMPLETA';setP(100,'ANÁLISE INCOMPLETA','#00ff88');const groups=[{l:'VALIDAÇÃO DO ARQUIVO',c:1},{l:'HISTÓRICO DE PROXY',c:0},{l:'CONEXÕES AO PC',c:0},{l:'DNS · CERTIFICADOS',c:1},{l:'JAILBREAK',c:1},{l:'FREE FIRE',c:1},{l:'VPN / TÚNEIS / ACESSO REMOTO IOS',c:1},{l:'CORRELAÇÕES',c:2},{l:'OUTRAS EVIDÊNCIAS',c:10}];groups.forEach((g,idx)=>{out+=`<div class="sec" onclick="document.getElementById('sec-${idx}').classList.toggle('open')"><div>🛡️</div><div class="lab">${g.l}</div><div class="cnt">${g.c} ▼</div></div><div class="items" id="sec-${idx}"><div class="card gray"><div style="font-size:10px;opacity:.5">Nenhuma evidência - LIMPO / VERIFICADO</div></div></div>`;});}secsDiv.innerHTML=out;$('#result').style.display='block';}
$('#f').addEventListener('change',e=>{if(e.target.files[0])run(e.target.files[0])});
</script>
</body>
</html>
